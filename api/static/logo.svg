<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="ShopFlow">
  <!-- Bag handle drawn as one flowing stroke -->
  <path d="M16 18 C16 8, 32 8, 32 18" fill="none" stroke="#0E6B8A" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Bag body -->
  <path d="M9 18 H39 L36.5 40 a3 3 0 0 1 -3 2.7 H14.5 a3 3 0 0 1 -3 -2.7 Z" fill="#0E6B8A"/>
  <!-- A small graph inside the bag: the data the assistant reads -->
  <path d="M17 34 L24 26 L31 32" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="17" cy="34" r="2.6" fill="#FFFFFF"/>
  <circle cx="24" cy="26" r="2.6" fill="#F2A93B"/>
  <circle cx="31" cy="32" r="2.6" fill="#FFFFFF"/>
</svg>
