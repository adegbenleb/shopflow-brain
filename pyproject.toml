[project]
name = "shopflow-brain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Blessing Adegbenle", email = "adegbenleb@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-postgres>=1.11.0",
    "fastapi>=0.146.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "neo4j>=6.4.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
shopflow-brain = "shopflow_brain:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
